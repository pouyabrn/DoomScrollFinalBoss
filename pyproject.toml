[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "doomscroll-final-boss"
version = "0.1.0"
description = "A private, daily, ranked AI-news briefing from public sources."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "pouyabrn" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Email",
  "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: News/Diary",
]
dependencies = [
  "alembic>=1.16.5,<2",
  "defusedxml>=0.7.1,<1",
  "feedparser>=6.0.12,<7",
  "httpx>=0.28.1,<1",
  "jinja2>=3.1.6,<4",
  "premailer>=3.10.0,<4",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic>=2.11.7,<3",
  "pydantic-settings>=2.10.1,<3",
  "pyyaml>=6.0.2,<7",
  "sqlalchemy>=2.0.43,<3",
  "tenacity>=9.1.2,<10",
]

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8.6,<2",
  "hypothesis>=6.138.7,<7",
  "mypy>=1.17.1,<2",
  "pip-audit>=2.9.0,<3",
  "pre-commit>=4.3.0,<5",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1.0,<2",
  "pytest-cov>=6.2.1,<7",
  "respx>=0.22.0,<1",
  "ruff>=0.12.10,<1",
  "types-defusedxml>=0.7.0.20260504",
  "types-PyYAML>=6.0.12.20250809",
]

[project.scripts]
finalboss = "finalboss.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/finalboss"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=finalboss --cov-report=term-missing:skip-covered --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["finalboss"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ASYNC", "B", "C4", "E", "F", "I", "N", "PERF", "PIE", "PT", "PTH", "RUF", "S", "SIM", "UP"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
packages = ["finalboss"]

[[tool.mypy.overrides]]
module = ["feedparser", "premailer"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
