name: Source smoke test

on:
  schedule:
    - cron: "23 10 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: false
      - name: Install locked runtime
        run: uv sync --frozen --no-dev
      - name: Collect and render without secrets or delivery
        env:
          FINALBOSS_ENVIRONMENT: test
          FINALBOSS_DATABASE_URL: sqlite:////tmp/finalboss-smoke.db
        run: uv run finalboss run --dry-run --output /tmp/finalboss-smoke.html
