sitemaps:
  # These official publishers do not expose a reliable RSS feed. We read only
  # their public sitemap metadata and never scrape page bodies.
  - id: anthropic
    name: Anthropic
    url: https://www.anthropic.com/sitemap.xml
    include_pattern: /(?:news|research)/
    category: labs
    tier: primary
    weight: 1.00
    max_items: 12
    max_child_sitemaps: 8
    terms_note: Official public sitemap metadata only; no page-body extraction.
  - id: mistral
    name: Mistral AI
    url: https://mistral.ai/sitemap-index.xml
    include_pattern: /news/
    category: labs
    tier: primary
    weight: 0.98
    max_items: 12
    max_child_sitemaps: 8
    terms_note: Official public sitemap metadata only; no page-body extraction.
  - id: cohere
    name: Cohere
    url: https://cohere.com/sitemap.xml
    include_pattern: /(?:blog|research)/
    category: labs
    tier: primary
    weight: 0.94
    max_items: 12
    max_child_sitemaps: 8
    terms_note: Official public sitemap metadata only; no page-body extraction.
  - id: stability-ai
    name: Stability AI
    url: https://stability.ai/sitemap.xml
    include_pattern: /news/
    category: labs
    tier: primary
    weight: 0.92
    max_items: 12
    max_child_sitemaps: 8
    terms_note: Official public sitemap metadata only; no page-body extraction.
